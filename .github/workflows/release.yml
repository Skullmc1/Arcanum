name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "readme media/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/Arcanum-*.jar | head -n1)
          VERSION=$(basename "$JAR" .jar | sed 's/^Arcanum-//')
          gh release create "v$VERSION" "$JAR" \
            --target "$GITHUB_SHA" \
            --title "Arcanum $VERSION" \
            --generate-notes \
            --latest
