<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Arcanum logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0f3d"/>
      <stop offset="0.6" stop-color="#2a1255"/>
      <stop offset="1" stop-color="#0c2233"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f5b942"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <g transform="translate(256 256)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer rune ring -->
    <circle r="200" stroke="#c4b5fd" stroke-opacity="0.55" stroke-width="5"/>
    <circle r="178" stroke="#c4b5fd" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="3 12"/>
    <!-- tick marks -->
    <g stroke="#e9d5ff" stroke-width="6">
      <path d="M0 -200v-22M0 200v22M-200 0h-22M200 0h22"/>
      <path d="M-141 -141l-15 -15M141 -141l15 -15M-141 141l-15 15M141 141l15 15"/>
    </g>
    <!-- interlocking triangles -->
    <polygon points="0,-130 112.6,65 -112.6,65" stroke="url(#gold)" stroke-width="7"/>
    <polygon points="0,130 112.6,-65 -112.6,-65" stroke="url(#teal)" stroke-width="7"/>
    <!-- inner ring -->
    <circle r="66" stroke="url(#gold)" stroke-opacity="0.9" stroke-width="5"/>
  </g>

  <!-- central A -->
  <text x="256" y="289" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="url(#gold)">A</text>
</svg>
